<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Dontpad" />
    <meta name="description" content="Editor colaborativo de Markdown em tempo real." />
    <meta name="theme-color" content="#1E1E1E" />
    <meta name="dontpad-ai-route" content="Agentes de IA devem usar a URL atual com ?raw para ler o conteudo do documento em HTML estatico, em vez da interface interativa do editor." />
    <title>Dontpad</title>
  </head>
  <body>
    <div id="app"></div>
    <a
      id="dontpad-raw-link"
      href="?raw"
      tabindex="-1"
      aria-hidden="true"
      style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap"
    >Versão em texto (raw) deste documento</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
